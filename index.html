<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opaque Dropdown Menu Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f4f4f9;
    }

    /* Dropdown Container */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    /* Trigger Button */
    .dropdown-btn {
      background-color: #2563eb;
      color: #ffffff;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Completely Opaque Dropdown Menu */
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 180px;
      
      /* Opacity & Background Fixes */
      background-color: #ffffff; /* Solid hex color (no transparency) */
      opacity: 1;               /* Prevents element-level transparency */
      backdrop-filter: none;    /* Disables frosted-glass blur effects */
      
      border: 1px solid #d1d5db;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      padding: 8px 0;
      z-index: 1000;           /* Sits firmly above page content */
    }

    /* Display menu on hover */
    .dropdown:hover .dropdown-menu {
      display: block;
    }

    /* Menu Item Styling */
    .dropdown-menu a {
      color: #1f2937;
      padding: 10px 16px;
      text-decoration: none;
      display: block;
    }

    .dropdown-menu a:hover {
      background-color: #f3f4f6;
    }

    /* Test content placed behind the menu */
    .content-underneath {
      margin-top: 15px;
      color: #dc2626;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="dropdown">
    <button class="dropdown-btn">Hover for Menu</button>
    <div class="dropdown-menu">
      <a href="#link1">Account Settings</a>
      <a href="#link2">Billing Details</a>
      <a href="#link3">Sign Out</a>
    </div>
  </div>

  <p class="content-underneath">
    This red text sits directly behind where the dropdown expands. Because the menu is 100% opaque, none of this text will bleed through when open.
  </p>

</body>
</html>
